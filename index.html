<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocaboo ✨</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

:root{
  --purple:#7857e8;--purple2:#6242d6;--pink:#ff77ae;--yellow:#ffcf56;
  --mint:#7be3c1;--blue:#82c8ff;--red:#ff7c7c;--orange:#ffad68;
  --ink:#30264b;--muted:#8d87a1;--bg:#f7f4ff;--white:#fff;
  --shadow:0 12px 35px rgba(72,52,130,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.app{display:flex;min-height:100vh}
.sidebar{
  width:245px;background:#fff;border-right:1px solid #eee7ff;
  padding:22px 15px;position:fixed;left:0;top:0;bottom:0;overflow:auto
}
.logo{font-size:28px;font-weight:900;color:var(--purple);padding:10px 14px 24px}
.nav button{
  width:100%;background:transparent;padding:13px 15px;border-radius:14px;
  text-align:left;color:var(--muted);font-weight:800;margin:3px 0
}
.nav button:hover,.nav button.active{background:#eeeaff;color:var(--purple)}
.main{margin-left:245px;width:calc(100% - 245px)}
.topbar{
  height:78px;background:#fff;border-bottom:1px solid #eee7ff;
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;
  position:sticky;top:0;z-index:10
}
.coins{background:#fff5cf;color:#a87500;padding:10px 15px;border-radius:30px;font-weight:900}
.top-actions{display:flex;align-items:center;gap:10px}
.nameInput{border:1px solid #e6def8;border-radius:12px;padding:9px 12px;width:150px}
.star{background:none;font-size:22px}
.content{padding:30px;max-width:1300px;margin:auto}
h1{font-size:34px;margin:0 0 8px;font-weight:900}
h2{font-size:24px;margin-top:0}
p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.card{
  background:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow);
  border:1px solid #eee8ff
}
.stat{font-size:30px;font-weight:900;color:var(--purple)}
.btn{
  background:var(--purple);color:#fff;padding:12px 18px;border-radius:13px;
  font-weight:900;transition:.15s
}
.btn:hover{transform:translateY(-1px);background:var(--purple2)}
.btn.secondary{background:#eeeaff;color:var(--purple)}
.btn.green{background:#48bd91}
.btn.red{background:var(--red)}
.btn.orange{background:var(--orange);color:#563000}
.btn.blue{background:var(--blue);color:#193b55}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
input,textarea,select{
  width:100%;border:1px solid #ded7ef;border-radius:12px;padding:12px;
  outline:none;background:#fff;color:var(--ink)
}
textarea{min-height:180px;resize:vertical}
.form{display:grid;gap:12px}
.word-row{
  display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;
  align-items:center;margin-bottom:10px
}
.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#eeeaff;color:var(--purple);font-weight:800}
.hero{
  background:linear-gradient(135deg,#eee9ff,#fff);
  border-radius:28px;padding:30px;margin-bottom:20px
}
.learning-card{
  max-width:650px;margin:20px auto;background:#fff;border-radius:28px;
  padding:45px;text-align:center;box-shadow:var(--shadow)
}
.big-word{font-size:48px;font-weight:900;margin:20px 0}
.answer{font-size:25px;font-weight:800;color:var(--purple);min-height:40px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.choice{background:#f0ecff;color:var(--ink);padding:16px;border-radius:14px;font-weight:800}
.choice:hover{background:#ddd5ff}
.game{
  min-height:230px;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center
}
.game-target{
  font-size:55px;font-weight:900;padding:25px;user-select:none
}
.timer{font-size:34px;font-weight:900;color:var(--purple)}
.memory-grid{
  display:grid;grid-template-columns:repeat(4,80px);gap:10px;justify-content:center
}
.memory-card{
  width:80px;height:80px;border-radius:12px;background:#ddd5ff;
  display:flex;align-items:center;justify-content:center;font-weight:900;
  cursor:pointer
}
.memory-card.open{background:#fff0b0}
.toast{
  position:fixed;right:25px;bottom:25px;background:#30264b;color:white;
  padding:14px 18px;border-radius:14px;z-index:100;display:none
}
.modal{
  position:fixed;inset:0;background:rgba(25,18,50,.5);display:none;
  align-items:center;justify-content:center;z-index:50;padding:20px
}
.modal-box{background:#fff;border-radius:22px;padding:25px;width:min(520px,100%)}
.auth{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#eee9ff,#fff4fa)
}
.auth-box{background:#fff;width:min(440px,92%);padding:35px;border-radius:28px;box-shadow:var(--shadow)}
.hidden{display:none!important}
.progress{height:12px;background:#eee8f7;border-radius:20px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--purple)}
.offer{display:flex;justify-content:space-between;align-items:center;gap:15px}
small{color:var(--muted)}
@media(max-width:900px){
  .sidebar{width:80px}.logo{font-size:0}.logo:first-letter{font-size:28px}
  .nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:20px}
  .main{margin-left:80px;width:calc(100% - 80px)}
  .grid{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
  .topbar{padding:0 12px}.content{padding:16px}.grid,.grid2{grid-template-columns:1fr}
  .word-row{grid-template-columns:1fr}.big-word{font-size:36px}
  .choices{grid-template-columns:1fr}.memory-grid{grid-template-columns:repeat(4,65px)}
  .memory-card{width:65px;height:65px}
}
</style>
</head>
<body>

<div id="auth" class="auth">
  <div class="auth-box">
    <div class="logo">Vocaboo ✨</div>
    <h1 id="authTitle">Willkommen!</h1>
    <p id="authText">Melde dich an oder erstelle kostenlos einen Account.</p>
    <div class="form">
      <input id="username" placeholder="Benutzername">
      <input id="password" type="password" placeholder="Passwort">
      <input id="playerName" placeholder="Dein Anzeigename (optional)">
      <button class="btn" id="authBtn">Registrieren</button>
      <button class="btn secondary" id="switchAuth">Ich habe schon einen Account</button>
    </div>
    <p style="font-size:13px;margin-top:15px">Neue Accounts erhalten automatisch <b>10.000.000 virtuelle Coins</b>.</p>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="logo">Vocaboo ✨</div>
    <div class="nav">
      <button data-screen="home">🏠 Startseite</button>
      <button data-screen="learn">🧠 Lernen</button>
      <button data-screen="words">📚 Meine Wörter</button>
      <button data-screen="cards">🃏 Karteikarten</button>
      <button data-screen="quiz">❓ Quiz</button>
      <button data-screen="write">✍️ Schreiben</button>
      <button data-screen="minigames">🎮 Mini-Games</button>
      <button data-screen="shop">🛍️ Shop</button>
      <button data-screen="collection">🏆 Sammlung</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><b>Vocaboo</b></div>
      <div class="top-actions">
        <input class="nameInput" id="nameInput" placeholder="Name">
        <span class="coins">🪙 <span id="coinTop">0</span></span>
        <button class="star" id="adminTrigger">⭐</button>
      </div>
    </header>

    <section class="content">
      <div id="home" class="screen"></div>
      <div id="learn" class="screen hidden"></div>
      <div id="words" class="screen hidden"></div>
      <div id="cards" class="screen hidden"></div>
      <div id="quiz" class="screen hidden"></div>
      <div id="write" class="screen hidden"></div>
      <div id="minigames" class="screen hidden"></div>
      <div id="shop" class="screen hidden"></div>
      <div id="collection" class="screen hidden"></div>
    </section>
  </main>
</div>

<div id="modal" class="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<div id="toast" class="toast"></div>

<script>
"use strict";

const USERS_KEY="vocaboo_users";
const CURRENT_KEY="vocaboo_current_user";
const SETTINGS_KEY="vocaboo_admin_settings";
const PIN_KEY="vocaboo_admin_pin";
const CODES_KEY="vocaboo_generated_codes";

const defaultSettings={
  wordImportCost:1000,
  learnReward:1000000,
  streakFreezeCost:90000000
};

let settings=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"null")||defaultSettings;
let users=JSON.parse(localStorage.getItem(USERS_KEY)||"{}");
let currentUser=localStorage.getItem(CURRENT_KEY);
let authMode="register";
let currentScreen="home";
let learning=null;
let quizState=null;
let writeState=null;
let memoryState=null;
let blitzState=null;
let reactionState=null;
let coinCatchState=null;

const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toLocaleString("de-DE");
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"_"+Math.random();
const today=()=>new Date().toISOString().slice(0,10);

function saveUsers(){localStorage.setItem(USERS_KEY,JSON.stringify(users))}
function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}
function user(){return users[currentUser]}
function saveUser(){if(currentUser){users[currentUser]=user();saveUsers()}}
function toast(msg){
  $("toast").textContent=msg;$("toast").style.display="block";
  setTimeout(()=>$("toast").style.display="none",2500);
}
function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function randomWord(){
  const w=user().words||[];
  return w.length?w[Math.floor(Math.random()*w.length)]:null;
}
function ensureUserShape(u){
  u.coins ??=10000000;
  u.xp ??=0;
  u.words ??=[];
  u.streak ??=0;
  u.bestStreak ??=0;
  u.lastStudyDate ??="";
  u.streakFreezes ??=0;
  u.claimedOffers ??=[];
  u.usedCodes ??=[];
  u.stats ??={sessions:0,correct:0,answers:0};
  return u;
}
function daysBetween(a,b){
  if(!a||!b)return 999;
  const x=new Date(a+"T00:00:00"),y=new Date(b+"T00:00:00");
  return Math.round((y-x)/86400000);
}
function markStudy(){
  const u=user(),t=today();
  if(u.lastStudyDate===t)return;
  const gap=daysBetween(u.lastStudyDate,t);

  if(!u.lastStudyDate){
    u.streak=1;
  }else if(gap===1){
    u.streak++;
  }else if(gap===2 && u.streakFreezes>0){
    u.streakFreezes--;
    u.streak++;
    toast("🧊 Dein Streak-Eis hat deine Streak gerettet!");
  }else{
    u.streak=1;
  }
  u.bestStreak=Math.max(u.bestStreak,u.streak);
  u.lastStudyDate=t;
  saveUser();
}
function addXP(n){user().xp+=n;saveUser()}

function showScreen(name){
  currentScreen=name;
  document.querySelectorAll(".screen").forEach(x=>x.classList.add("hidden"));
  $(name).classList.remove("hidden");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.screen===name));
  render();
}

function render(){
  if(!currentUser)return;
  ensureUserShape(user());
  saveUser();
  $("coinTop").textContent=money(user().coins);
  $("nameInput").value=user().playerName||currentUser;
  renderHome();renderWords();renderLearn();renderCards();renderQuiz();renderWrite();renderGames();renderShop();renderCollection();
}

function renderHome(){
  const u=user();
  $("home").innerHTML=`
    <div class="hero">
      <h1>Hallo ${esc(u.playerName||currentUser)}! 👋</h1>
      <p>Willkommen zurück bei Vocaboo. Lerne Wörter und baue deine Streak auf.</p>
      <button class="btn" onclick="showScreen('learn')">🧠 Jetzt lernen</button>
    </div>
    <div class="grid">
      <div class="card"><small>Coins</small><div class="stat">${money(u.coins)}</div></div>
      <div class="card"><small>Streak</small><div class="stat">🔥 ${u.streak}</div></div>
      <div class="card"><small>Streak-Eis</small><div class="stat">🧊 ${u.streakFreezes}</div></div>
      <div class="card"><small>Wörter</small><div class="stat">${u.words.length}</div></div>
    </div>
    <br>
    <div class="grid2">
      <div class="card">
        <h2>Dein Fortschritt</h2>
        <p>XP: <b>${money(u.xp)}</b></p>
        <div class="progress"><span style="width:${Math.min(100,(u.xp%1000)/10)}%"></span></div>
        <p>${u.stats.answers} Antworten · ${u.stats.correct} richtig</p>
      </div>
      <div class="card">
        <h2>🎁 Lernbonus</h2>
        <p>Eine abgeschlossene Lernrunde bringt dir:</p>
        <h2>🪙 ${money(settings.learnReward)} Coins</h2>
        <small>Lernen selbst kostet 0 Coins.</small>
      </div>
    </div>`;
}

function renderWords(){
  const u=user();
  $("words").innerHTML=`
    <h1>📚 Meine Wörter</h1>
    <p>Importiere mehrere Wörter. Neue Wörter kosten ${money(settings.wordImportCost)} Coins pro Wort. Bestehende Wörter kannst du kostenlos bearbeiten.</p>

    <div class="card">
      <h2>Wörter importieren</h2>
      <p>Eine Zeile pro Wort. Beispiele: <b>apple</b> oder <b>apple = Apfel</b></p>
      <textarea id="importText" placeholder="apple
house
school = Schule
friend"></textarea>
      <br><br>
      <button class="btn" onclick="importWords()">🌍 Importieren & übersetzen</button>
    </div>

    <br>
    <div class="card">
      <h2>Meine Wörter bearbeiten</h2>
      ${u.words.length?u.words.map(w=>`
        <div class="word-row">
          <input id="en_${w.id}" value="${esc(w.en)}">
          <input id="de_${w.id}" value="${esc(w.de)}">
          <button class="btn green" onclick="saveWord('${w.id}')">Speichern</button>
          <button class="btn red" onclick="deleteWord('${w.id}')">Löschen</button>
        </div>`).join(""):"<p>Noch keine Wörter vorhanden.</p>"}
    </div>`;
}

async function translateWord(word){
  const dictionary={
    apple:"Apfel",house:"Haus",school:"Schule",book:"Buch",friend:"Freund",
    family:"Familie",water:"Wasser",food:"Essen",cat:"Katze",dog:"Hund",
    car:"Auto",computer:"Computer",phone:"Telefon",hello:"Hallo",goodbye:"Auf Wiedersehen",
    morning:"Morgen",night:"Nacht",sun:"Sonne",moon:"Mond",love:"Liebe",
    happy:"glücklich",sad:"traurig",big:"groß",small:"klein",fast:"schnell",
    slow:"langsam",red:"rot",blue:"blau",green:"grün",school:"Schule",
    teacher:"Lehrer",student:"Schüler",book:"Buch",table:"Tisch",chair:"Stuhl"
  };
  const key=word.toLowerCase().trim();
  if(dictionary[key])return dictionary[key];

  try{
    const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(word)+"&langpair=en|de";
    const r=await fetch(url);
    const d=await r.json();
    const t=d?.responseData?.translatedText;
    if(t && t.toLowerCase()!==word.toLowerCase())return t;
  }catch(e){}
  return "Bitte Übersetzung bearbeiten";
}

async function importWords(){
  const text=$("importText").value.trim();
  if(!text)return toast("Bitte Wörter eingeben.");

  const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
  const parsed=[];
  for(const line of lines){
    let parts=line.split(/\s*(?:=|;|\t)\s*/);
    parsed.push({en:parts[0].trim(),de:parts[1]?.trim()||""});
  }

  const existing=new Set(user().words.map(w=>w.en.toLowerCase()));
  const fresh=parsed.filter(x=>x.en&&!existing.has(x.en.toLowerCase()));

  if(!fresh.length)return toast("Diese Wörter sind bereits vorhanden.");
  const cost=fresh.length*settings.wordImportCost;
  if(user().coins<cost)return toast("Nicht genug Coins.");

  toast("🌍 Übersetzungen werden gesucht...");
  for(const item of fresh){
    if(!item.de)item.de=await translateWord(item.en);
  }

  user().coins-=cost;
  fresh.forEach(x=>user().words.push({
    id:uid(),en:x.en,de:x.de,createdAt:new Date().toISOString()
  }));
  saveUser();
  $("importText").value="";
  toast(`✅ ${fresh.length} Wörter importiert!`);
  render();
}

function saveWord(id){
  const w=user().words.find(x=>x.id===id);
  if(!w)return;
  const en=$("en_"+id).value.trim();
  const de=$("de_"+id).value.trim();
  if(!en||!de)return toast("Beide Felder ausfüllen.");
  w.en=en;w.de=de;saveUser();toast("✅ Wort gespeichert.");
}
function deleteWord(id){
  if(!confirm("Dieses Wort wirklich löschen?"))return;
  user().words=user().words.filter(w=>w.id!==id);
  saveUser();render();toast("Wort gelöscht.");
}

function finishLearning(){
  if(!learning)return;
  markStudy();
  user().coins+=settings.learnReward;
  user().stats.sessions++;
  saveUser();
  toast(`🎉 Runde geschafft! +${money(settings.learnReward)} Coins`);
  learning=null;
  renderLearn();
  renderHome();
}
function renderLearn(){
  const el=$("learn");
  const u=user();
  if(u.words.length<1){
    el.innerHTML=`<h1>🧠 Lernen</h1><div class="card"><h2>Du brauchst zuerst Wörter.</h2><button class="btn" onclick="showScreen('words')">📚 Wörter importieren</button></div>`;
    return;
  }
  if(!learning){
    el.innerHTML=`
      <h1>🧠 Lernen</h1>
      <div class="learning-card">
        <h2>5-Wörter-Lernrunde</h2>
        <p>Die Runde kostet 0 Coins.</p>
        <h2>🎁 +${money(settings.learnReward)} Coins</h2>
        <button class="btn" onclick="startLearning()">Runde starten</button>
      </div>`;
    return;
  }

  const w=learning.current;
  el.innerHTML=`
    <h1>🧠 Lernen</h1>
    <div class="learning-card">
      <span class="badge">${learning.index+1} / 5</span>
      <div class="big-word">${esc(w.en)}</div>
      <div class="answer">${learning.revealed?esc(w.de):"?"}</div>
      ${!learning.revealed?
        `<button class="btn" onclick="learning.revealed=true;renderLearn()">Übersetzung zeigen</button>`:
        `<div class="choices">
          <button class="btn green" onclick="learningAnswer(true)">✅ Gewusst</button>
          <button class="btn red" onclick="learningAnswer(false)">🔁 Nochmal</button>
        </div>`
      }
    </div>`;
}
function startLearning(){
  const pool=shuffle(user().words);
  learning={list:pool.slice(0,Math.min(5,pool.length)),index:0,revealed:false,current:null};
  learning.current=learning.list[0];
  renderLearn();
}
function learningAnswer(correct){
  user().stats.answers++;
  if(correct){user().stats.correct++;addXP(20)}
  learning.index++;
  if(learning.index>=learning.list.length)return finishLearning();
  learning.current=learning.list[learning.index];
  learning.revealed=false;
  saveUser();renderLearn();
}

function renderCards(){
  const el=$("cards");
  if(!user().words.length){
    el.innerHTML=`<h1>🃏 Karteikarten</h1><div class="card">Importiere zuerst Wörter.</div>`;
    return;
  }
  el.innerHTML=`
    <h1>🃏 Karteikarten</h1>
    <div class="learning-card" id="flashcard">
      <div class="big-word" id="cardWord">${esc(window.cardWord?.en||user().words[0].en)}</div>
      <div class="answer" id="cardAnswer"></div>
      <button class="btn" onclick="flipCard()">Umdrehen</button>
      <button class="btn secondary" onclick="nextCard()">Nächste Karte</button>
    </div>`;
}
window.cardWord=window.cardWord||null;
function flipCard(){
  const w=window.cardWord||user().words[0];
  $("cardAnswer").textContent=w.de;
}
function nextCard(){
  window.cardWord=randomWord();renderCards();
}

function newQuiz(){
  const words=user().words;
  if(words.length<2)return;
  const q=randomWord();
  const wrong=shuffle(words.filter(w=>w.id!==q.id)).slice(0,3).map(w=>w.de);
  quizState={q,answers:shuffle([q.de,...wrong])};
}
function renderQuiz(){
  const el=$("quiz");
  if(user().words.length<2){
    el.innerHTML=`<h1>❓ Quiz</h1><div class="card">Du brauchst mindestens 2 Wörter.</div>`;
    return;
  }
  if(!quizState)newQuiz();
  el.innerHTML=`
    <h1>❓ Übersetzungs-Quiz</h1>
    <div class="learning-card">
      <p>Was bedeutet:</p>
      <div class="big-word">${esc(quizState.q.en)}</div>
      <div class="choices">
        ${quizState.answers.map(a=>`<button class="choice" onclick="answerQuiz('${esc(a).replace(/'/g,"&#39;")}')">${esc(a)}</button>`).join("")}
      </div>
    </div>`;
}
function answerQuiz(answer){
  const correct=answer===quizState.q.de;
  if(correct){addXP(50);user().stats.correct++;toast("✅ Richtig! +50 XP");}
  else toast("❌ Nicht ganz.");
  user().stats.answers++;saveUser();quizState=null;renderQuiz();
}

function renderWrite(){
  const el=$("write");
  if(!user().words.length){
    el.innerHTML=`<h1>✍️ Schreiben</h1><div class="card">Importiere zuerst Wörter.</div>`;
    return;
  }
  if(!writeState)writeState={w:randomWord(),done:false};
  el.innerHTML=`
    <h1>✍️ Schreiben</h1>
    <div class="learning-card">
      <p>Übersetze ins Deutsche:</p>
      <div class="big-word">${esc(writeState.w.en)}</div>
      <input id="writeAnswer" placeholder="Deine Übersetzung">
      <br><br>
      <button class="btn" onclick="checkWrite()">Prüfen</button>
      ${writeState.done?`<p><b>Lösung:</b> ${esc(writeState.w.de)}</p><button class="btn secondary" onclick="writeState=null;renderWrite()">Nächstes Wort</button>`:""}
    </div>`;
}
function checkWrite(){
  const a=$("writeAnswer").value.trim().toLowerCase();
  const correct=a===writeState.w.de.trim().toLowerCase();
  user().stats.answers++;
  if(correct){addXP(75);user().stats.correct++;toast("🎉 Richtig! +75 XP")}
  else toast("Noch nicht ganz.");
  writeState.done=true;saveUser();renderWrite();
}

const offers=[
  {id:"o1",name:"+1.000.000 Coin-Bonus",amount:1000000},
  {id:"o2",name:"+5.000.000 Coin-Bonus",amount:5000000},
  {id:"o3",name:"+10.000.000 Coin-Bonus",amount:10000000},
  {id:"o4",name:"+25.000.000 Coin-Bonus",amount:25000000},
  {id:"o5",name:"+50.000.000 Coin-Bonus",amount:50000000},
  {id:"o6",name:"+100.000.000 Coin-Bonus",amount:100000000}
];

function renderShop(){
  const u=user();
  $("shop").innerHTML=`
    <h1>🛍️ Shop</h1>
    <p>Alle Angebote sind rein virtuell und verwenden keine echten Zahlungen.</p>
    <div class="card">
      <div class="offer">
        <div><h2>🧊 Streak auf Eis</h2><p>Schützt eine verpasste Lernnacht.</p></div>
        <button class="btn blue" onclick="buyFreeze()">90.000.000 Coins</button>
      </div>
      <p>Du besitzt: 🧊 <b>${u.streakFreezes}</b></p>

          <p>${o.name}</p>
          <button class="btn" ${claimed?"disabled":""} onclick="claimOffer('${o.id}')">

    <br>

}
function buyFreeze(){
  if(user().coins<settings.streakFreezeCost)return toast("Nicht genug Coins.");
  user().coins-=settings.streakFreezeCost;
  user().streakFreezes++;
  saveUser();toast("🧊 Streak-Eis gekauft!");
  render();
}
function claimOffer(id){
  const o=offers.find(x=>x.id===id);
  if(!o||user().claimedOffers.includes(id))return;
  user().claimedOffers.push(id);
  user().coins+=o.amount;
  saveUser();toast(`🎁 +${money(o.amount)} Coins!`);render();
}
function redeemCode(){
  const code=$("codeInput").value.trim().toUpperCase();
  const codes=JSON.parse(localStorage.getItem(CODES_KEY)||"[]");
  const c=codes.find(x=>x.code===code);
  if(!c)return toast("Code nicht gefunden.");
  if(user().usedCodes.includes(code))return toast("Du hast diesen Code schon verwendet.");
  if(c.uses>=c.maxUses)return toast("Dieser Code ist aufgebraucht.");
  c.uses++;
  user().usedCodes.push(code);
  user().coins+=c.coins;
  localStorage.setItem(CODES_KEY,JSON.stringify(codes));
  saveUser();toast(`🎉 +${money(c.coins)} Coins erhalten!`);render();
}

function renderCollection(){

  const badges=[];
  if(u.words.length>=1)badges.push("📚 Erste Wörter");
  if(u.words.length>=10)badges.push("📖 Wort-Sammler");
  if(u.streak>=3)badges.push("🔥 3-Tage-Streak");
  if(u.streak>=7)badges.push("🔥 Wochen-Streak");
  if(u.xp>=1000)badges.push("⭐ 1.000 XP");

      <div class="card"><small>XP</small><div class="stat">${money(u.xp)}</div></div>

/* =========================
   MINI-GAMES
========================= */

const games=[
  {id:"blitz",name:"⚡ Word Blitz",cost:50000,desc:"So viele Übersetzungen wie möglich in 30 Sekunden."},
  {id:"speed",name:"🚀 Speed Translation",cost:75000,desc:"10 Wörter so schnell wie möglich."},
  {id:"memory",name:"🧠 Memory",cost:100000,desc:"Finde passende Wortpaare."},
  {id:"spelling",name:"✍️ Spell Rush",cost:125000,desc:"Schreibe die Übersetzungen richtig."},
  {id:"reaction",name:"🦊 Reaction Fox",cost:150000,desc:"Klicke den Fuchs so schnell wie möglich."},
  {id:"catch",name:"🪙 Coin Catch",cost:200000,desc:"Fange die Sterne innerhalb des Zeitlimits."}
];

function renderGames(){
  $("minigames").innerHTML=`
    <h1>🎮 Mini-Games</h1>
    <p>Die Spiele kosten virtuelle Coins. Je höher der Preis, desto größer die Herausforderung.</p>
    <div class="grid2">
      ${games.map(g=>`
        <div class="card">
          <h2>${g.name}</h2>
          <p>${g.desc}</p>
          <span class="badge">🪙 ${money(g.cost)} Einsatz</span>
          <br><br>
          <button class="btn" onclick="startGame('${g.id}')">Spielen</button>
        </div>`).join("")}
    </div>
    <br><div class="card" id="gameArea">
      <h2>Wähle ein Spiel</h2>
      <p>Die Spiele werden direkt hier gestartet.</p>
    </div>`;
}

function payGame(id){
  const g=games.find(x=>x.id===id);
  if(user().coins<g.cost){toast("Nicht genug Coins für dieses Spiel.");return false}
  user().coins-=g.cost;saveUser();return true;
}

function startGame(id){
  if(!payGame(id))return;
  if(id==="blitz")startBlitz();
  if(id==="speed")startSpeed();
  if(id==="memory")startMemory();
  if(id==="spelling")startSpelling();
  if(id==="reaction")startReaction();
  if(id==="catch")startCatch();
  render();
}

function needWords(){
  if(user().words.length<2){
    toast("Du brauchst mindestens 2 Wörter.");
    return false;
  }
  return true;
}

/* Word Blitz */
function startBlitz(){
  if(!needWords())return;
  blitzState={time:30,score:0,w:randomWord()};
  showGame(`<div class="game">
    <h2>⚡ Word Blitz</h2>
    <div class="timer" id="gameTimer">30</div>
    <p>Was bedeutet: <b id="blitzWord">${esc(blitzState.w.en)}</b>?</p>
    <input id="blitzInput" placeholder="Übersetzung" onkeydown="if(event.key==='Enter')answerBlitz()">
    <br><button class="btn" onclick="answerBlitz()">Antwort</button>
    <p>Punkte: <b id="blitzScore">0</b></p>
  </div>`);
  blitzState.interval=setInterval(()=>{
    blitzState.time--;
    if($("gameTimer"))$("gameTimer").textContent=blitzState.time;
    if(blitzState.time<=0)endBlitz();
  },1000);
}
function answerBlitz(){
  if(!blitzState)return;
  const val=$("blitzInput").value.trim().toLowerCase();
  if(val===blitzState.w.de.toLowerCase()){
    blitzState.score++;addXP(10);
  }
  blitzState.w=randomWord();
  $("blitzWord").textContent=blitzState.w.en;
  $("blitzInput").value="";
  $("blitzScore").textContent=blitzState.score;
}
function endBlitz(){
  if(!blitzState)return;
  clearInterval(blitzState.interval);
  const reward=blitzState.score*25000;
  user().coins+=reward;saveUser();
  toast(`⚡ Spiel vorbei! +${money(reward)} Coins`);
  blitzState=null;renderGames();render();
}

/* Speed Translation */
function startSpeed(){
  if(!needWords())return;
  blitzState={time:45,score:0,round:0,w:randomWord()};
  showGame(`<div class="game">
    <h2>🚀 Speed Translation</h2>
    <div class="timer" id="gameTimer">45</div>
    <p><b id="speedWord">${esc(blitzState.w.en)}</b></p>
    <div class="choices" id="speedChoices"></div>
    <p>Richtig: <b id="speedScore">0</b> / 10</p>
  </div>`);
  speedChoices();
  blitzState.interval=setInterval(()=>{
    blitzState.time--;
    if($("gameTimer"))$("gameTimer").textContent=blitzState.time;
    if(blitzState.time<=0)endSpeed();
  },1000);
}
function speedChoices(){
  const w=blitzState.w;
  const answers=shuffle([w.de,...shuffle(user().words.filter(x=>x.id!==w.id)).slice(0,3).map(x=>x.de)]);
  $("speedChoices").innerHTML=answers.map(a=>`<button class="choice" onclick="speedAnswer('${esc(a).replace(/'/g,"&#39;")}')">${esc(a)}</button>`).join("");
}
function speedAnswer(a){
  if(!blitzState)return;
  if(a===blitzState.w.de){blitzState.score++;addXP(15)}
  blitzState.round++;
  if(blitzState.round>=10)return endSpeed();
  blitzState.w=randomWord();
  $("speedWord").textContent=blitzState.w.en;
  $("speedScore").textContent=blitzState.score;
  speedChoices();
}
function endSpeed(){
  if(!blitzState)return;
  clearInterval(blitzState.interval);
  const reward=blitzState.score*30000;
  user().coins+=reward;saveUser();
  toast(`🚀 Runde beendet! +${money(reward)} Coins`);
  blitzState=null;renderGames();render();
}

/* Memory */
function startMemory(){
  if(user().words.length<4)return toast("Für Memory brauchst du mindestens 4 Wörter.");
  const pairs=shuffle(user().words).slice(0,4);
  memoryState={cards:shuffle(pairs.flatMap(w=>[
    {id:w.id,type:"en",text:w.en},
    {id:w.id,type:"de",text:w.de}
  ])),open:[],matched:0,locked:false};
  showGame(`<div class="game">
    <h2>🧠 Memory</h2>
    <div class="memory-grid" id="memoryGrid"></div>
    <p>Paare: <b id="memoryScore">0 / 4</b></p>
  </div>`);
  drawMemory();
}
function drawMemory(){
  $("memoryGrid").innerHTML=memoryState.cards.map((c,i)=>{
    const open=memoryState.open.includes(i)||c.matched;
    return `<div class="memory-card ${open?"open":""}" onclick="memoryClick(${i})">${open?esc(c.text):"?"}</div>`;
  }).join("");
}
function memoryClick(i){
  const s=memoryState;
  if(s.locked||s.open.includes(i)||s.cards[i].matched)return;
  s.open.push(i);drawMemory();
  if(s.open.length===2){
    s.locked=true;
    const [a,b]=s.open;
    setTimeout(()=>{
      if(s.cards[a].id===s.cards[b].id && s.cards[a].type!==s.cards[b].type){
        s.cards[a].matched=true;s.cards[b].matched=true;s.matched++;addXP(30);
      }
      s.open=[];s.locked=false;drawMemory();
      $("memoryScore").textContent=s.matched+" / 4";
      if(s.matched===4){
        const reward=150000;
        user().coins+=reward;saveUser();
        toast(`🧠 Memory geschafft! +${money(reward)} Coins`);
      }
    },650);
  }
}

/* Spelling */
function startSpelling(){
  if(!needWords())return;
  blitzState={round:0,score:0,w:randomWord()};
  showGame(`<div class="game">
    <h2>✍️ Spell Rush</h2>
    <p>Übersetze:</p>
    <div class="game-target" id="spellWord">${esc(blitzState.w.en)}</div>
    <input id="spellInput" placeholder="Deutsche Übersetzung">
    <br><button class="btn" onclick="spellAnswer()">Prüfen</button>
    <p><b id="spellScore">0</b> / 10 richtig</p>
  </div>`);
}
function spellAnswer(){
  const s=blitzState;
  if(!s)return;
  const a=$("spellInput").value.trim().toLowerCase();
  if(a===s.w.de.toLowerCase()){s.score++;addXP(25);toast("✅ Richtig!")}
  else toast("❌ Lösung: "+s.w.de);
  s.round++;
  if(s.round>=10){
    const reward=s.score*35000;
    user().coins+=reward;saveUser();
    toast(`✍️ Fertig! +${money(reward)} Coins`);
    blitzState=null;renderGames();render();return;
  }
  s.w=randomWord();
  $("spellWord").textContent=s.w.en;
  $("spellInput").value="";
  $("spellScore").textContent=s.score;
}

/* Reaction */
function startReaction(){
  reactionState={time:10,score:0,target:false};
  showGame(`<div class="game">
    <h2>🦊 Reaction Fox</h2>
    <p>Klicke den Fuchs so schnell du kannst!</p>
    <div id="reactionArea" style="height:180px;width:100%;position:relative;background:#f2efff;border-radius:18px"></div>
    <p>Treffer: <b id="reactionScore">0</b></p>
  </div>`);
  moveFox();
  reactionState.interval=setInterval(()=>{
    reactionState.time--;
    if(reactionState.time<=0)endReaction();
    else moveFox();
  },1000);
}
function moveFox(){
  const area=$("reactionArea");if(!area)return;
  const x=Math.random()*80+5,y=Math.random()*65+5;
  area.innerHTML=`<button style="position:absolute;left:${x}%;top:${y}%;font-size:35px;background:none" onclick="hitFox()">🦊</button>`;
}
function hitFox(){
  if(!reactionState)return;
  reactionState.score++;addXP(10);
  $("reactionScore").textContent=reactionState.score;
  moveFox();
}
function endReaction(){
  if(!reactionState)return;
  clearInterval(reactionState.interval);
  const reward=reactionState.score*30000;
  user().coins+=reward;saveUser();
  toast(`🦊 Reaktion beendet! +${money(reward)} Coins`);
  reactionState=null;renderGames();render();
}

/* Coin Catch */
function startCatch(){
  coinCatchState={time:20,score:0};
  showGame(`<div class="game">
    <h2>🪙 Coin Catch</h2>
    <div class="timer" id="catchTimer">20</div>
    <div id="catchArea" style="height:230px;width:100%;position:relative;background:#fff8dd;border-radius:18px"></div>
    <p>Gefangen: <b id="catchScore">0</b></p>
  </div>`);
  moveCoin();
  coinCatchState.interval=setInterval(()=>{
    coinCatchState.time--;
    if($("catchTimer"))$("catchTimer").textContent=coinCatchState.time;
    if(coinCatchState.time<=0)endCatch();
    else moveCoin();
  },1000);
}
function moveCoin(){
  const area=$("catchArea");if(!area)return;
  const x=Math.random()*88+2,y=Math.random()*75+2;
  area.innerHTML=`<button style="position:absolute;left:${x}%;top:${y}%;font-size:30px;background:none" onclick="catchCoin()">🪙</button>`;
}
function catchCoin(){
  if(!coinCatchState)return;
  coinCatchState.score++;addXP(5);
  $("catchScore").textContent=coinCatchState.score;
  moveCoin();
}
function endCatch(){
  if(!coinCatchState)return;
  clearInterval(coinCatchState.interval);
  const reward=coinCatchState.score*20000;
  user().coins+=reward;saveUser();
  toast(`🪙 Gefangen: ${coinCatchState.score} → +${money(reward)} Coins`);
  coinCatchState=null;renderGames();render();
}
function showGame(html){$("gameArea").innerHTML=html}

let starClicks=0,starTimer=null;

$("adminTrigger").onclick=()=>{
  starClicks++;
  clearTimeout(starTimer);

function openAdminLogin(){
  openModal(`
    <h2>⚙️ Admin</h2>
    <input id="adminPin" type="password" placeholder="Admin-PIN">
    <br><br><button class="btn" onclick="checkAdmin()">Öffnen</button>

}
function checkAdmin(){
  const pin=localStorage.getItem(PIN_KEY)||"7777";
  if($("adminPin").value!==pin)return toast("Falsche PIN.");
  openAdmin();
}
function openAdmin(){
  const codes=JSON.parse(localStorage.getItem(CODES_KEY)||"[]");
  openModal(`
    <h2>⚙️ Vocaboo Admin</h2>
    <p><small>Hinweis: Diese Demo speichert Daten nur in localStorage. Das ist keine sichere Server-Authentifizierung.</small></p>

    <h3>Preise & Belohnungen</h3>
    <label>Importkosten pro neuem Wort</label>
    <input id="adminImportCost" type="number" value="${settings.wordImportCost}">
    <br><br>
    <label>Coins pro Lernrunde</label>
    <input id="adminLearnReward" type="number" value="${settings.learnReward}">
    <br><br>
    <label>Preis Streak-Eis</label>
    <input id="adminFreezeCost" type="number" value="${settings.streakFreezeCost}">

    <button class="btn" onclick="saveAdminSettings()">Einstellungen speichern</button>

    <h3>🎟️ Coin-Code erstellen</h3>

    <br><br>
    <button class="btn secondary" onclick="closeModal()">Schließen</button>
  `);
}
function saveAdminSettings(){
  settings.wordImportCost=Math.max(0,Number($("adminImportCost").value)||0);
  settings.learnReward=Math.max(0,Number($("adminLearnReward").value)||0);
  settings.streakFreezeCost=Math.max(0,Number($("adminFreezeCost").value)||0);
  saveSettings();closeModal();render();toast("Admin-Einstellungen gespeichert.");
}
function createCode(){
  const coins=Number($("codeAmount").value);
  const maxUses=Number($("codeUses").value);
  if(!coins||!maxUses)return toast("Coins und Nutzungen angeben.");
  const codes=JSON.parse(localStorage.getItem(CODES_KEY)||"[]");
  const code="VOC-"+Math.random().toString(36).substring(2,8).toUpperCase();
  codes.push({code,coins,maxUses,uses:0,createdAt:new Date().toISOString()});
  localStorage.setItem(CODES_KEY,JSON.stringify(codes));
  toast("Code erstellt: "+code);
  openAdmin();
}
function changeAdminPin(){
  const pin=$("newAdminPin").value.trim();
  if(pin.length<4)return toast("PIN muss mindestens 4 Zeichen haben.");
  localStorage.setItem(PIN_KEY,pin);toast("PIN geändert.");
}

/* =========================
   AUTH
========================= */

$("switchAuth").onclick=()=>{
  authMode=authMode==="register"?"login":"register";
  $("authTitle").textContent=authMode==="register"?"Willkommen!":"Willkommen zurück!";
  $("authText").textContent=authMode==="register"?"Erstelle deinen kostenlosen Account.":"Melde dich mit deinem Account an.";
  $("authBtn").textContent=authMode==="register"?"Registrieren":"Anmelden";
  $("playerName").classList.toggle("hidden",authMode==="login");
  $("switchAuth").textContent=authMode==="register"?"Ich habe schon einen Account":"Ich möchte einen neuen Account";
};

$("authBtn").onclick=()=>{
  const name=$("username").value.trim().toLowerCase();
  const pass=$("password").value;
  const display=$("playerName").value.trim();

  if(name.length<3)return toast("Benutzername muss mindestens 3 Zeichen haben.");
  if(pass.length<4)return toast("Passwort muss mindestens 4 Zeichen haben.");

  if(authMode==="register"){
    if(users[name])return toast("Dieser Benutzername existiert bereits.");
    users[name]=ensureUserShape({
      password:pass,
      playerName:display||name,
      coins:10000000,
      xp:0,words:[],streak:0,bestStreak:0,lastStudyDate:"",
      streakFreezes:0,claimedOffers:[],usedCodes:[],
      stats:{sessions:0,correct:0,answers:0}
    });
  }else{
    if(!users[name]||users[name].password!==pass)return toast("Benutzername oder Passwort falsch.");
  }

  currentUser=name;
  localStorage.setItem(CURRENT_KEY,name);
  saveUsers();
  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");
  showScreen("home");
};

$("nameInput").onchange=()=>{
  if(!currentUser)return;
  user().playerName=$("nameInput").value.trim()||currentUser;
  saveUser();renderHome();
};

/* Modal */
function openModal(html){
  $("modalBox").innerHTML=html;
  $("modal").style.display="flex";
}
function closeModal(){$("modal").style.display="none"}
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};

/* Navigation */
document.querySelectorAll(".nav button").forEach(b=>{
  b.onclick=()=>showScreen(b.dataset.screen);
});

/* Start */
if(currentUser && users[currentUser]){
  ensureUserShape(users[currentUser]);
  saveUsers();
  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");
  showScreen("home");
}else{
  $("auth").classList.remove("hidden");
  $("app").classList.add("hidden");
}
